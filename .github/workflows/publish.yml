name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # Two ways to authorize, pick one:
      #   Trusted publishing (no token): on pypi.org go to Account settings →
      #   "Add a new pending publisher" (PyPI) with owner Ch1rpy2613,
      #   repo pdfcopy, workflow publish.yml, environment pypi.
      #   API token: add repository secret PYPI_API_TOKEN instead.
      - uses: pypi/gh-action-pypi-publish@release/v1
